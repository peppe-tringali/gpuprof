name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      # Run every combo; don't stop the whole matrix on a single failure.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev extras (no torch — tested separately)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[server,postgres,dev,host]"

      - name: Run unit + integration tests (mock GPU backend)
        env:
          GPUPROF_MOCK: "1"
        run: pytest tests/ -x --tb=short

  test-torch:
    # A second job that exercises the auto-instrumentation code paths
    # (torch is heavy; skip on the matrix above).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install with torch (CPU wheel)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[server,dev,host]"
          pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Run torch-dependent tests
        env:
          GPUPROF_MOCK: "1"
        run: pytest tests/ -x --tb=short
