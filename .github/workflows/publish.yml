# Publish to PyPI via Trusted Publishing (OIDC).
#
# ONE-TIME SETUP on PyPI:
#   1. https://pypi.org/manage/project/gpuprof/settings/publishing/
#   2. Add a new pending publisher / trusted publisher:
#        Owner:         peppe-tringali
#        Repository:    gpuprof
#        Workflow name: publish.yml
#        Environment:   pypi
#
# RELEASE FLOW after setup:
#   git tag v0.7.1 && git push --tags
#     → triggers this workflow, publishes to PyPI.
#   Actions tab → "Publish" → Run workflow — same effect, useful if
#   you want to re-publish an already-tagged commit.
#
# The published wheel/sdist come from the exact commit the tag
# points at — no local `~/.pypirc` needed and no long-lived tokens.

name: Publish

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch: {}

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tooling
        run: python -m pip install --upgrade build twine
      - name: Build
        run: python -m build
      - name: Check
        run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish → PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/gpuprof/
    permissions:
      id-token: write        # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
